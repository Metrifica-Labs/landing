name: metrifica_landing
description: Metrifica Landing Page
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.2
  phosphor_flutter: ^2.1.0

  # Utils
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.12
  riverpod_generator: ^2.6.2
  flutter_gen_runner: ^5.10.0

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie_animations/
