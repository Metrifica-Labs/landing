name: metrifica_landing
description: Metrifica Landing Page
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.2
  phosphor_flutter: ^2.1.0

  # Supabase
  supabase_flutter: ^2.8.4

  # Utils
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

  # Code generation
  build_runner: ^2.4.12
  riverpod_generator: ^2.6.2
  flutter_gen_runner: ^5.10.0

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

flutter_launcher_icons:
  image_path: "assets/images/metrifica_1024.png"
  web:
    generate: true
    image_path: "assets/images/metrifica_1024.png"
    background_color: "#1A6FFA"
    theme_color: "#1A6FFA"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tech/
    - assets/lottie_animations/
    - assets/objects/
