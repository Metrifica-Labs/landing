<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Metrifica Labs — Desenvolvemos soluções digitais personalizadas para transformar ideias em resultados reais.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Metrifica Labs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Metrifica Labs</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to cut DNS/TLS latency for external resources -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

  <!-- importmap required by hero3d.js — zero cost unless hero3d.js actually imports -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/"
      }
    }
  </script>

  <!-- hero3d.js detects mobile internally and skips downloading THREE.js (~700 KB) -->
  <script type="module" src="hero3d.js"></script>

  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '984713577850224');
  fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=984713577850224&ev=PageView&noscript=1"
  /></noscript>
  <script>
    var _mfFormStarted = false;
    var _mfFormSubmitted = false;
    function metrificaFormStart() {
      if (_mfFormStarted) return;
      _mfFormStarted = true;
      if (typeof fbq !== 'undefined') fbq('trackCustom', 'FormStart');
    }
    function metrificaFormSubmit() {
      _mfFormSubmitted = true;
      if (typeof fbq !== 'undefined') fbq('track', 'Lead');
    }
    window.addEventListener('beforeunload', function() {
      if (_mfFormStarted && !_mfFormSubmitted) {
        if (typeof fbq !== 'undefined') fbq('trackCustom', 'FormAbandon');
      }
    });
  </script>
  <!-- End Meta Pixel Code -->
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
